{% extends 'base.html' %}{% block title %}Change admin password{% endblock %}{% block content %}<section class="auth-card"><span class="eyebrow">SECURITY</span><h1>Change password</h1><form method="post" class="form-stack"><label>Current password<input type="password" name="old_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="12" autocomplete="new-password"><small>At least 12 characters.</small></label><button class="btn btn-dark btn-full" type="submit">Update password</button></form></section>{% endblock %}
